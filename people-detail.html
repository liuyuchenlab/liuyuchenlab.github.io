<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>成员详情-GaGaLab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet" /><link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="brand">
        <img src="assets/logo.png" alt="GaGaLab" class="logo-img" /><span class="brand-text"><span data-i18n="brand.full">GaGaLab</span></span>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html" data-i18n="nav.home">首页</a>
        <a href="research.html" data-i18n="nav.research">研究方向</a>
        <a href="people.html" data-i18n="nav.people">团队成员</a>
        <a href="publications.html" data-i18n="nav.publications">论文成果</a>
        <a href="news.html" data-i18n="nav.news">新闻动态</a>
        <a href="join.html" data-i18n="nav.join">加入我们</a>
        <a href="contact.html" data-i18n="nav.contact">联系方式</a>
      </nav>
      <div class="nav-tools">
        <div class="lang-toggle">
          <button data-lang="zh" type="button">中</button>
          <button data-lang="en" type="button">EN</button>
        </div>
        <button class="nav-toggle" id="navToggle" type="button" aria-label="菜单">☰</button>
      </div>
    </div>
  </header>

  <section class="page-header has-bg" style="--header-bg: url('/assets/chibang.png')">
    <div class="container">
      <h1 data-i18n="peoplePage.title">团队成员</h1>
      <p data-i18n="peoplePage.subtitle">课题组由一名课题组长（PI）、若干博士/硕士研究生与本科生组成。</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <a href="people.html" class="back-link" style="display:inline-block;margin-bottom:24px;color:var(--primary);text-decoration:none;">← <span data-i18n="pages.backHome">返回</span></a>
      <div id="member-detail" class="member-detail-card"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-logos">
        <img src="assets/nankaidaxue.png" alt="南开大学" class="footer-logo" />
        <img src="assets/shengmingkexuexueyuan.png" alt="南开大学生命科学学院" class="footer-logo" />
      </div>
    </div>
  </footer>

  <script src="js/data-loader.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script>
    // 从 members/*.md 加载成员详情；优先读取 ?file= 参数，回退到 ?cat=&id= 的 i18n 静态数据
    let memberDetailItem = null;

    function renderMemberDetailCard(m) {
      const el = document.querySelector("#member-detail");
      if (!m) {
        el.innerHTML = `<p style="text-align:center;color:var(--text-muted);">成员不存在。<a href="people.html" style="color:var(--primary);">返回团队成员</a></p>`;
        return;
      }
      const avatar = m.image
        ? `<img src="${m.image}" alt="${t(m.name)}" class="member-detail-photo" />`
        : `<div class="member-detail-avatar">${(t(m.name) || "?").charAt(0)}</div>`;
      document.title = `${t(m.name)}-GaGaLab`;
      const focusHtml = m.focus ? `<div class="member-detail-focus"><strong data-i18n="peoplePage.focusLabel">研究方向：</strong>${t(m.focus)}</div>` : (m.interests ? `<div class="member-detail-focus">${t(m.interests)}</div>` : "");
      el.innerHTML = `
        <div class="member-detail-layout">
          <div class="member-detail-left">
            ${avatar}
            <h1 class="member-detail-name">${t(m.name)}</h1>
            <div class="member-detail-role">${t(m.role)}</div>
          </div>
          <div class="member-detail-right">
            <div class="member-detail-top">${focusHtml}</div>
            <div class="member-detail-bio">${m.bio ? t(m.bio) : ""}</div>
          </div>
        </div>
      `;
    }

    async function initMemberDetail() {
      applyI18n();
      const params = new URLSearchParams(window.location.search);
      const file = params.get("file");
      const cat = params.get("cat");
      const id = params.get("id");

      let item = null;
      if (file) {
        try { item = await DataLoader.loadMemberDetail(file); } catch (e) { item = null; }
      }
      if (!item) {
        // 回退到 i18n.peoplePage 静态数据
        const pp = i18n.peoplePage;
        if (cat === "pi") {
          item = pp.pi;
        } else if (cat) {
          const list = pp[cat];
          const idx = parseInt(id || "0", 10);
          if (Array.isArray(list) && list[idx]) item = list[idx];
        }
      }

      memberDetailItem = item;
      renderMemberDetailCard(item);
      applyI18n();
      window.addEventListener("langchange", () => { renderMemberDetailCard(memberDetailItem); applyI18n(); });
    }

    initMemberDetail();
  </script>
</body>
</html>
