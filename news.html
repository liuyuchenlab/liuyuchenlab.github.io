<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新闻动态 · GaGaLab</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="brand">
        <img src="assets/logo.png" alt="GaGaLab" class="logo-img" />
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html" data-i18n="nav.home">首页</a>
        <a href="research.html" data-i18n="nav.research">研究方向</a>
        <a href="people.html" data-i18n="nav.people">团队成员</a>
        <a href="publications.html" data-i18n="nav.publications">论文成果</a>
        <a href="news.html" data-i18n="nav.news">新闻动态</a>
        <a href="join.html" data-i18n="nav.join">加入我们</a>
        <a href="contact.html" data-i18n="nav.contact">联系方式</a>
      </nav>
      <div class="nav-tools">
        <div class="lang-toggle">
          <button data-lang="zh" type="button">中</button>
          <button data-lang="en" type="button">EN</button>
        </div>
        <button class="nav-toggle" id="navToggle" type="button" aria-label="菜单">☰</button>
      </div>
    </div>
  </header>

  <section class="page-header">
    <div class="container">
      <span class="eyebrow" data-i18n="newsPage.title">新闻动态</span>
      <h1 data-i18n="newsPage.title">新闻动态</h1>
      <p data-i18n="newsPage.subtitle">课题组的最新动态。</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="news-list" id="news-full-list"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-col footer-brand">
          <a href="index.html" class="brand"><img src="assets/logo.png" alt="GaGaLab" class="logo-img" /></a>
          <p data-i18n="footer.about">隶属学校名称，致力于生物信息学方法学与生物学问题研究。</p>
        </div>
        <div class="footer-col">
          <h5 data-i18n="footer.linksTitle">快速链接</h5>
          <a href="research.html" data-i18n="nav.research">研究方向</a>
          <a href="people.html" data-i18n="nav.people">团队成员</a>
          <a href="publications.html" data-i18n="nav.publications">论文成果</a>
          <a href="join.html" data-i18n="nav.join">加入我们</a>
        </div>
        <div class="footer-col">
          <h5 data-i18n="nav.news">新闻动态</h5>
          <a href="news.html" data-i18n="nav.news">实验室动态</a>
          <a href="publications.html" data-i18n="nav.publications">最新论文</a>
          <a href="join.html" data-i18n="nav.join">招生信息</a>
        </div>
        <div class="footer-col">
          <h5 data-i18n="footer.contactTitle">联系方式</h5>
          <p data-i18n="footer.addr">学校名称 · 学院名称 · 实验室房间号</p>
          <a href="mailto:lab@example.edu" data-i18n="footer.email">lab@example.edu</a>
        </div>
      </div>
      <div class="footer-bottom">
        <span data-i18n="footer.copyright">© 2026 GaGaLab. 保留所有权利。</span>
        <span data-i18n="footer.built">由课题组构建</span>
      </div>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script>
    function renderFullNews() {
      document.querySelector("#news-full-list").innerHTML = i18n.newsPage.items.map(item => `
        <article class="news-item reveal">
          <div class="news-image"><img src="${item.image}" alt="${t(item.title)}" loading="lazy" /></div>
          <div class="news-body">
            <div class="news-date">${t(item.date)}</div>
            <div class="news-content">
              <h5>${t(item.title)}</h5>
              <p>${t(item.desc)}</p>
            </div>
          </div>
        </article>
      `).join("");
    }
    renderFullNews();
    applyI18n();
    document.querySelectorAll(".reveal").forEach(el => {
      const o = new IntersectionObserver((e) => {
        e.forEach(x => { if (x.isIntersecting) { x.target.classList.add("in-view"); o.unobserve(x.target); } });
      }, { threshold: 0.1 });
      o.observe(el);
    });
  </script>
</body>
</html>
