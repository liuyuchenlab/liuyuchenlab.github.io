<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新闻动态-GaGaLab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet" /><link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="brand">
        <img src="assets/logo.png" alt="GaGaLab" class="logo-img" /><span class="brand-text"><span data-i18n="brand.full">GaGaLab</span></span>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html" data-i18n="nav.home">首页</a>
        <a href="research.html" data-i18n="nav.research">研究方向</a>
        <a href="people.html" data-i18n="nav.people">团队成员</a>
        <a href="publications.html" data-i18n="nav.publications">论文成果</a>
        <a href="news.html" data-i18n="nav.news">新闻动态</a>
        <a href="join.html" data-i18n="nav.join">加入我们</a>
        <a href="contact.html" data-i18n="nav.contact">联系方式</a>
      </nav>
      <div class="nav-tools">
        <div class="lang-toggle">
          <button data-lang="zh" type="button">中</button>
          <button data-lang="en" type="button">EN</button>
        </div>
        <button class="nav-toggle" id="navToggle" type="button" aria-label="菜单">☰</button>
      </div>
    </div>
  </header>

  <section class="page-header has-bg" style="--header-bg: url('/assets/yanhua.jpg')">
    <div class="container">
      <h1 data-i18n="newsPage.title">新闻动态</h1>
      <p data-i18n="newsPage.subtitle">课题组的最新动态。</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="news-list" id="news-full-list"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-logos">
        <img src="assets/nankaidaxue.png" alt="南开大学" class="footer-logo" />
        <img src="assets/shengmingkexuexueyuan.png" alt="南开大学生命科学学院" class="footer-logo" />
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/data-loader.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script>
    // 从 news/*.md 自动加载新闻列表；加载失败时回退到 i18n.js 静态数据
    let newsData = null;

    function renderFullNews() {
      const list = newsData || i18n.newsPage.items;
      document.querySelector("#news-full-list").innerHTML = list.map((item, i) => {
        const href = item.file
          ? `news-detail.html?file=${encodeURIComponent(item.file)}`
          : `news-detail.html?id=${i}`;
        return `
        <a href="${href}" class="news-item reveal" style="text-decoration:none;color:inherit;">
          <div class="news-image"><img src="${item.image}" alt="${t(item.title)}" loading="lazy" /></div>
          <div class="news-body">
            <div class="news-date">${t(item.date)}</div>
            <div class="news-content">
              <h5>${t(item.title)}</h5>
              <p>${t(item.desc)}</p>
            </div>
          </div>
        </a>`;
      }).join("");
    }

    async function initNews() {
      applyI18n();
      try {
        newsData = await DataLoader.loadNewsIndex();
      } catch (e) {
        newsData = null;
      }
      renderFullNews();
      applyI18n();
      window.addEventListener("langchange", () => { renderFullNews(); applyI18n(); });
    }

    initNews();
  </script>
</body>
</html>
