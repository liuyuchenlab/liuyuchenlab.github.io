  <script>
    // 高德 JS API：可交互地图，点击标记跳转高德地图详情
    function initMap() {
      if (typeof AMap === "undefined") return;
      var position = [117.349071, 38.988846]; // 实验室精确位置（标记点）
      var schoolCenter = [117.346, 38.989]; // 南开大学津南校区中心
      var map = new AMap.Map("amap", {
        zoom: 14,
        center: schoolCenter,
        viewMode: "2D",
      });
      var marker = new AMap.Marker({
        position: position,
        map: map,
        cursor: "pointer",
      });
      marker.on("click", function () {
        var name = encodeURIComponent(
          currentLang === "en"
            ? "State Key Lab of Medicinal Chemical Biology, Nankai University"
            : "南开大学津南校区药物化学生物学国家重点实验室"
        );
        window.open(
          `https://uri.amap.com/marker?position=${position[0]},${position[1]}&name=${name}&src=GaGaLab&coordinate=gaode&callnative=0`,
          "_blank"
        );
      });
      AMap.plugin(["AMap.ToolBar"], function () {
        map.addControl(new AMap.ToolBar({ position: "RB" }));
      });
    }
    initMap();
  </script>
