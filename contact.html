      <nav class="nav-links" id="navLinks">

  <section class="page-header">
    <div class="container">
      <h1 data-i18n="contactPage.title">联系方式</h1>
      <p data-i18n="contactPage.subtitle">欢迎通过以下方式与我们联系。</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="contact-grid">
        <div class="contact-info-card reveal">
          <h3 data-i18n="contactPage.infoTitle">联系信息</h3>
          <div class="contact-row">
            <span class="label" data-i18n="contactPage.addrLabel">地址</span>
            <span class="value" data-i18n="contactPage.addr">学校名称 · 学院名称 · 课题组实验室（房间号）</span>
          </div>
          <div class="contact-row">
            <span class="label" data-i18n="contactPage.emailLabel">邮箱</span>
            <span class="value"><a href="mailto:gagalab@qq.com" data-i18n="footer.email">lab@example.edu</a></span>
          </div>
          <h3 style="margin-top:24px;" data-i18n="contactPage.socialTitle">在线平台</h3>
          <div class="social-links">
            <a href="https://github.com/liuyuchenlab" target="_blank" rel="noopener" class="social-icon" aria-label="GitHub">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
            </a>
            <a href="#" target="_blank" rel="noopener" class="social-icon" aria-label="抖音">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19.321 5.562a5.124 5.124 0 01-3.414-1.26 5.151 5.151 0 01-1.658-2.723h-2.983v12.418a2.62 2.62 0 01-2.62 2.618 2.62 2.62 0 110-5.236c.214 0 .423.018.627.053V8.43a6.025 6.025 0 00-.627-.033A5.725 5.725 0 108.646 19.8a5.725 5.725 0 005.725-5.725V8.679a8.382 8.382 0 004.95 1.618V7.31a5.14 5.14 0 01-2.978-1.748z"/></svg>
            </a>
            <a href="#" target="_blank" rel="noopener" class="social-icon" aria-label="小红书">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M6.5 3h11A3.5 3.5 0 0121 6.5v11a3.5 3.5 0 01-3.5 3.5h-11A3.5 3.5 0 013 17.5v-11A3.5 3.5 0 016.5 3zm2.5 5v8h1.2V12.3l1.4 1.8 1.4-1.8V16H14V8h-1.2v3.5L10.4 9.5 8.2 12.5V8H9zm8.5 0a1.5 1.5 0 100 3 1.5 1.5 0 000-3z"/></svg>
            </a>
          </div>
        </div>
        <div class="contact-map-card reveal">
          <div class="map-embed">
            <iframe
              src="https://www.google.com/maps?ll=38.9989,117.2256&z=16&output=embed"
              width="100%"
              height="360"
              style="border:0;border-radius:8px;"
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
              allowfullscreen></iframe>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-col footer-brand">
          <a href="index.html" class="brand"><img src="assets/logo.png" alt="GaGaLab" class="logo-img" /><span class="brand-text"><span data-i18n="brand.full">GaGaLab</span></span></a>
          <p data-i18n="footer.about">隶属学校名称，致力于生物信息学方法学与生物学问题研究。</p>
        </div>
        <div class="footer-col">
          <h5 data-i18n="footer.linksTitle">快速链接</h5>
          <a href="research.html" data-i18n="nav.research">研究方向</a>
          <a href="people.html" data-i18n="nav.people">团队成员</a>

        </div>
        <div class="footer-col">
          <h5 data-i18n="nav.news">新闻动态</h5>
          <a href="news.html" data-i18n="nav.news">实验室动态</a>
          <a href="publications.html" data-i18n="nav.publications">最新论文</a>
          <a href="join.html" data-i18n="nav.join">招生信息</a>
        </div>
        <div class="footer-col">
          <h5 data-i18n="footer.contactTitle">联系方式</h5>
          <p data-i18n="footer.addr">学校名称 · 学院名称 · 实验室房间号</p>
          <a href="mailto:gagalab@qq.com" data-i18n="footer.email">lab@example.edu</a>
        </div>
      </div>
      <div class="footer-bottom">
        <span data-i18n="footer.copyright">© 2026 GaGaLab. 保留所有权利。</span>
        <span data-i18n="footer.built">由课题组构建</span>
      </div>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.querySelectorAll(".reveal").forEach(el => {
      const o = new IntersectionObserver((e) => {
        e.forEach(x => { if (x.isIntersecting) { x.target.classList.add("in-view"); o.unobserve(x.target); } });
      }, { threshold: 0.1 });
      o.observe(el);
    });
  </script>
</body>
</html>
