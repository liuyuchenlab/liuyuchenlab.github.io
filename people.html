<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>团队成员-GaGaLab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet" /><link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="brand">
        <img src="assets/logo.png" alt="GaGaLab" class="logo-img" /><span class="brand-text"><span data-i18n="brand.full">GaGaLab</span></span>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html" data-i18n="nav.home">首页</a>
        <a href="research.html" data-i18n="nav.research">研究方向</a>
        <a href="people.html" data-i18n="nav.people">团队成员</a>
        <a href="publications.html" data-i18n="nav.publications">论文成果</a>
        <a href="news.html" data-i18n="nav.news">新闻动态</a>
        <a href="join.html" data-i18n="nav.join">加入我们</a>
        <a href="contact.html" data-i18n="nav.contact">联系方式</a>
      </nav>
      <div class="nav-tools">
        <div class="lang-toggle">
          <button data-lang="zh" type="button">中</button>
          <button data-lang="en" type="button">EN</button>
        </div>
        <button class="nav-toggle" id="navToggle" type="button" aria-label="菜单">☰</button>
      </div>
    </div>
  </header>

  <section class="page-header has-bg" style="--header-bg: url('/assets/chibang.png')">
    <div class="container">
      <h1 data-i18n="peoplePage.title">团队成员</h1>
      <p data-i18n="peoplePage.subtitle">课题组由一名课题组长（PI）、若干博士/硕士研究生与本科生组成。</p>
    </div>
  </section>

  <section class="section people-content">
    <div class="container">
      <!-- PI -->
      <h2 class="member-group-title" data-i18n="peoplePage.piTitle">课题组长</h2>
      <div class="pi-card reveal" id="pi-card"></div>

      <!-- 工作人员 -->
      <h2 class="member-group-title" data-i18n="peoplePage.staffTitle">工作人员</h2>
      <div class="team-grid" id="staff-grid"></div>

      <!-- 博士后 -->
      <h2 class="member-group-title" data-i18n="peoplePage.postdocsTitle">博士后</h2>
      <div class="team-grid" id="postdocs-grid"></div>

      <!-- 研究生 -->
      <h2 class="member-group-title" data-i18n="peoplePage.studentsTitle">研究生</h2>
      <div class="team-grid" id="students-grid"></div>

      <!-- 本科生 -->
      <h2 class="member-group-title" data-i18n="peoplePage.undergradsTitle">本科生</h2>
      <div class="team-grid" id="undergrads-grid"></div>

      <!-- 校友 -->
      <h2 class="member-group-title" data-i18n="peoplePage.alumniTitle">校友</h2>
      <div class="team-grid" id="alumni-grid"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-logos">
        <img src="assets/nankaidaxue.png" alt="南开大学" class="footer-logo" />
        <img src="assets/shengmingkexuexueyuan.png" alt="南开大学生命科学学院" class="footer-logo" />
      </div>
    </div>
  </footer>

  <script src="js/data-loader.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script>
    // 从 members/*.md 加载成员数据并按 category 分组；失败回退到 i18n.js 静态数据
    let peopleData = null;

    function renderPeople() {
      const data = peopleData; // { pi:[...], staff:[...], ... }

      // 优先用 MD 数据，否则回退 i18n.peoplePage.pi
      const pi = (data && data.pi && data.pi.length) ? data.pi[0] : i18n.peoplePage.pi;
      const piAvatar = pi.image
        ? `<img src="${pi.image}" alt="${t(pi.name)}" class="pi-photo" />`
        : `<div class="pi-avatar">${(t(pi.name) || "?").charAt(0)}</div>`;
      const piHref = pi.file
        ? `people-detail.html?file=${encodeURIComponent(pi.file)}`
        : `people-detail.html?cat=pi`;
      document.querySelector("#pi-card").innerHTML = `
        <a href="${piHref}" class="pi-link" style="text-decoration:none;color:inherit;display:contents;">
          ${piAvatar}
          <div class="pi-info">
            <h3>${t(pi.name)}</h3>
            <div class="role">${t(pi.role)}</div>
            <p>${t(pi.bioShort)}</p>
            <div class="interests">${t(pi.interests)}</div>
          </div>
        </a>
      `;

      // 各类成员卡片渲染（MD 数据优先，回退 i18n）
      function getList(cat, i18nKey) {
        if (data && data[cat] && data[cat].length) return data[cat];
        return i18n.peoplePage[i18nKey] || [];
      }
      function renderMemberList(list, containerId, cat) {
        const c = document.querySelector(containerId);
        if (!c) return;
        c.innerHTML = list.map((m, i) => {
          const avatar = m.image
            ? `<img src="${m.image}" alt="${t(m.name)}" class="member-photo" />`
            : `<div class="avatar">${(t(m.name) || "?").charAt(0)}</div>`;
          const href = m.file
            ? `people-detail.html?file=${encodeURIComponent(m.file)}`
            : `people-detail.html?cat=${cat}&id=${i}`;
          return `<a href="${href}" class="member-card reveal" style="text-decoration:none;color:inherit;">
            ${avatar}
            <h4>${t(m.name)}</h4>
            <div class="role">${t(m.role)}</div>
            <div class="focus">${t(m.focus)}</div>
          </a>`;
        }).join("");
      }
      renderMemberList(getList("staff", "staff"), "#staff-grid", "staff");
      renderMemberList(getList("postdocs", "postdocs"), "#postdocs-grid", "postdocs");
      renderMemberList(getList("students", "students"), "#students-grid", "students");
      renderMemberList(getList("undergrads", "undergrads"), "#undergrads-grid", "undergrads");
      renderMemberList(getList("alumni", "alumni"), "#alumni-grid", "alumni");
    }

    async function initPeople() {
      applyI18n();
      try {
        peopleData = await DataLoader.loadMembersIndex();
      } catch (e) {
        peopleData = null;
      }
      renderPeople();
      applyI18n();
      window.addEventListener("langchange", () => { renderPeople(); applyI18n(); });
    }

    initPeople();
  </script>
</body>
</html>
