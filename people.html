<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>团队成员-GaGaLab</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="brand">
        <img src="assets/logo.png" alt="GaGaLab" class="logo-img" /><span class="brand-text"><span data-i18n="brand.full">GaGaLab</span></span>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html" data-i18n="nav.home">首页</a>
        <a href="research.html" data-i18n="nav.research">研究方向</a>
        <a href="people.html" data-i18n="nav.people">团队成员</a>
        <a href="publications.html" data-i18n="nav.publications">论文成果</a>
        <a href="news.html" data-i18n="nav.news">新闻动态</a>
        <a href="join.html" data-i18n="nav.join">加入我们</a>
        <a href="contact.html" data-i18n="nav.contact">联系方式</a>
      </nav>
      <div class="nav-tools">
        <div class="lang-toggle">
          <button data-lang="zh" type="button">中</button>
          <button data-lang="en" type="button">EN</button>
        </div>
        <button class="nav-toggle" id="navToggle" type="button" aria-label="菜单">☰</button>
      </div>
    </div>
  </header>

  <section class="page-header has-bg" style="--header-bg: url('/assets/bg-cells.jpg')">
    <div class="container">
      <h1 data-i18n="peoplePage.title">团队成员</h1>
      <p data-i18n="peoplePage.subtitle">课题组由一名课题组长（PI）、若干博士/硕士研究生与本科生组成。</p>
    </div>
  </section>

  <section class="section people-content">
    <div class="container">
      <!-- PI -->
      <h2 class="member-group-title" data-i18n="peoplePage.piTitle">课题组长</h2>
      <div class="pi-card reveal" id="pi-card"></div>

      <!-- 工作人员 -->
      <h2 class="member-group-title" data-i18n="peoplePage.staffTitle">工作人员</h2>
      <div class="team-grid" id="staff-grid"></div>

      <!-- 博士后 -->
      <h2 class="member-group-title" data-i18n="peoplePage.postdocsTitle">博士后</h2>
      <div class="team-grid" id="postdocs-grid"></div>

      <!-- 研究生 -->
      <h2 class="member-group-title" data-i18n="peoplePage.studentsTitle">研究生</h2>
      <div class="team-grid" id="students-grid"></div>

      <!-- 本科生 -->
      <h2 class="member-group-title" data-i18n="peoplePage.undergradsTitle">本科生</h2>
      <div class="team-grid" id="undergrads-grid"></div>

      <!-- 校友 -->
      <h2 class="member-group-title" data-i18n="peoplePage.alumniTitle">校友</h2>
      <div class="team-grid" id="alumni-grid"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-logos">
        <img src="assets/nankaidaxue.png" alt="南开大学" class="footer-logo" />
        <img src="assets/shengmingkexuexueyuan.png" alt="南开大学生命科学学院" class="footer-logo" />
      </div>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script>
    function renderPeople() {
      // PI
      const pi = i18n.peoplePage.pi;
      const piAvatar = pi.image
        ? `<img src="${pi.image}" alt="${t(pi.name)}" class="pi-photo" />`
        : `<div class="pi-avatar">${(t(pi.name) || "?").charAt(0)}</div>`;
      document.querySelector("#pi-card").innerHTML = `
        ${piAvatar}
        <div class="pi-info">
          <h3>${t(pi.name)}</h3>
          <div class="role">${t(pi.role)}</div>
          <p>${t(pi.bio)}</p>
          <div class="interests">${t(pi.interests)}</div>
        </div>
      `;
      // 学生/本科生/校友 共用卡片渲染
      function renderMemberList(list, containerId) {
        const c = document.querySelector(containerId);
        if (!c) return;
        c.innerHTML = list.map(m => {
          const avatar = m.image
            ? `<img src="${m.image}" alt="${t(m.name)}" class="member-photo" />`
            : `<div class="avatar">${(t(m.name) || "?").charAt(0)}</div>`;
          return `<article class="member-card reveal">
            ${avatar}
            <h4>${t(m.name)}</h4>
            <div class="role">${t(m.role)}</div>
            <div class="focus">${t(m.focus)}</div>
          </article>`;
        }).join("");
      }
      renderMemberList(i18n.peoplePage.staff, "#staff-grid");
      renderMemberList(i18n.peoplePage.postdocs, "#postdocs-grid");
      renderMemberList(i18n.peoplePage.students, "#students-grid");
      renderMemberList(i18n.peoplePage.undergrads, "#undergrads-grid");
      renderMemberList(i18n.peoplePage.alumni, "#alumni-grid");
    }
    renderPeople();
    applyI18n();
    document.querySelectorAll(".reveal").forEach(el => {
      const o = new IntersectionObserver((e) => {
        e.forEach(x => { if (x.isIntersecting) { x.target.classList.add("in-view"); o.unobserve(x.target); } });
      }, { threshold: 0.1 });
      o.observe(el);
    });
    window.addEventListener("langchange", () => { renderPeople(); applyI18n(); });
  </script>
</body>
</html>
