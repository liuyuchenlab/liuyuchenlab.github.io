<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GaGaLab</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="brand">
        <img src="assets/logo.png" alt="GaGaLab" class="logo-img" /><span class="brand-text"><span data-i18n="brand.full">GaGaLab</span></span>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html" data-i18n="nav.home">首页</a>
        <a href="research.html" data-i18n="nav.research">研究方向</a>
        <a href="people.html" data-i18n="nav.people">团队成员</a>
        <a href="publications.html" data-i18n="nav.publications">论文成果</a>
        <a href="news.html" data-i18n="nav.news">新闻动态</a>
        <a href="join.html" data-i18n="nav.join">加入我们</a>
        <a href="contact.html" data-i18n="nav.contact">联系方式</a>
      </nav>
      <div class="nav-tools">
        <div class="lang-toggle">
          <button data-lang="zh" type="button">中</button>
          <button data-lang="en" type="button">EN</button>
        </div>
        <button class="nav-toggle" id="navToggle" type="button" aria-label="菜单">☰</button>
      </div>
    </div>
  </header>

  <section class="page-header">
    <div class="container">
      <span class="eyebrow" data-i18n="publicationsPage.title">论文成果</span>
      <h1 data-i18n="publicationsPage.title">论文成果</h1>
      <p data-i18n="publicationsPage.subtitle">课题组的代表性论文与软件工具。</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="pub-filters" id="pub-filters">
        <button class="pub-filter active" data-filter="all" data-i18n="publicationsPage.categories.all">全部</button>
        <button class="pub-filter" data-filter="journal" data-i18n="publicationsPage.categories.journal">期刊论文</button>
        <button class="pub-filter" data-filter="software" data-i18n="publicationsPage.categories.software">软件工具</button>
        <button class="pub-filter" data-filter="patent" data-i18n="publicationsPage.categories.patent">专利</button>
      </div>
      <div class="pub-list" id="pub-list"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-col footer-brand">
          <a href="index.html" class="brand"><img src="assets/logo.png" alt="GaGaLab" class="logo-img" /><span class="brand-text"><span data-i18n="brand.full">GaGaLab</span></span></a>
          <p data-i18n="footer.about">隶属学校名称，致力于生物信息学方法学与生物学问题研究。</p>
        </div>
        <div class="footer-col">
          <h5 data-i18n="footer.linksTitle">快速链接</h5>
          <a href="research.html" data-i18n="nav.research">研究方向</a>
          <a href="people.html" data-i18n="nav.people">团队成员</a>
          <a href="publications.html" data-i18n="nav.publications">论文成果</a>
          <a href="join.html" data-i18n="nav.join">加入我们</a>
        </div>
        <div class="footer-col">
          <h5 data-i18n="nav.news">新闻动态</h5>
          <a href="news.html" data-i18n="nav.news">实验室动态</a>
          <a href="publications.html" data-i18n="nav.publications">最新论文</a>
          <a href="join.html" data-i18n="nav.join">招生信息</a>
        </div>
        <div class="footer-col">
          <h5 data-i18n="footer.contactTitle">联系方式</h5>
          <p data-i18n="footer.addr">学校名称 · 学院名称 · 实验室房间号</p>
          <a href="mailto:lab@example.edu" data-i18n="footer.email">lab@example.edu</a>
        </div>
      </div>
      <div class="footer-bottom">
        <span data-i18n="footer.copyright">© 2026 GaGaLab. 保留所有权利。</span>
        <span data-i18n="footer.built">由课题组构建</span>
      </div>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script>
    let pubFilter = "all";
    function renderPubs() {
      const list = i18n.publicationsPage.items
        .filter(p => pubFilter === "all" || p.type === pubFilter)
        .map(p => `
          <article class="pub-item reveal" data-type="${p.type}">
            <div class="pub-year">${p.year}</div>
            <div>
              <span class="pub-type ${p.type}">${p.type === "journal" ? "Journal" : p.type === "patent" ? "Patent" : "Software"}</span>
              <div class="pub-title">${t(p.title)}</div>
              <div class="pub-authors">${t(p.authors)}</div>
              <div class="pub-venue">${t(p.venue)}</div>
            </div>
            <a class="pub-link" href="${p.link}" target="_blank" rel="noopener">Link →</a>
          </article>
        `).join("");
      document.querySelector("#pub-list").innerHTML = list || `<p style="text-align:center;color:var(--text-muted);">No items.</p>`;
    }
    document.querySelectorAll(".pub-filter").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".pub-filter").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        pubFilter = btn.dataset.filter;
        renderPubs();
      });
    });
    renderPubs();
    applyI18n();
    document.querySelectorAll(".reveal").forEach(el => {
      const o = new IntersectionObserver((e) => {
        e.forEach(x => { if (x.isIntersecting) { x.target.classList.add("in-view"); o.unobserve(x.target); } });
      }, { threshold: 0.1 });
      o.observe(el);
    });
    window.addEventListener("langchange", () => { renderPubs(); applyI18n(); });
  </script>
</body>
</html>
