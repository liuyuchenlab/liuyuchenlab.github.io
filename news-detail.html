<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GaGaLab</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="brand">
        <img src="assets/logo.png" alt="GaGaLab" class="logo-img" /><span class="brand-text"><span data-i18n="brand.full">GaGaLab</span></span>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html" data-i18n="nav.home">首页</a>
        <a href="research.html" data-i18n="nav.research">研究方向</a>
        <a href="people.html" data-i18n="nav.people">团队成员</a>
        <a href="publications.html" data-i18n="nav.publications">论文成果</a>
        <a href="news.html" data-i18n="nav.news">新闻动态</a>
        <a href="join.html" data-i18n="nav.join">加入我们</a>
        <a href="contact.html" data-i18n="nav.contact">联系方式</a>
      </nav>
      <div class="nav-tools">
        <div class="lang-toggle">
          <button data-lang="zh" type="button">中</button>
          <button data-lang="en" type="button">EN</button>
        </div>
        <button class="nav-toggle" id="navToggle" type="button" aria-label="菜单">☰</button>
      </div>
    </div>
  </header>

  <section class="page-header">
    <div class="container">
      <a href="news.html" style="color:var(--primary);text-decoration:none;font-size:0.9rem;">← <span data-i18n="nav.news">新闻动态</span></a>
      <div id="news-detail" style="margin-top:24px;"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-col footer-brand">
          <a href="index.html" class="brand"><img src="assets/logo.png" alt="GaGaLab" class="logo-img" /><span class="brand-text"><span data-i18n="brand.full">GaGaLab</span></span></a>
          <p data-i18n="footer.about">致力于发育生物学研究，从受精到衰老，探索生命的奥秘。</p>
        </div>
        <div class="footer-col">
          <h5 data-i18n="footer.linksTitle">快速链接</h5>
          <a href="research.html" data-i18n="nav.research">研究方向</a>
          <a href="people.html" data-i18n="nav.people">团队成员</a>
          <a href="publications.html" data-i18n="nav.publications">论文成果</a>
          <a href="join.html" data-i18n="nav.join">加入我们</a>
        </div>
        <div class="footer-col">
          <h5 data-i18n="footer.contactTitle">联系方式</h5>
          <p data-i18n="footer.addr">南开大学津南校区 · 药化生国家重点实验室</p>
          <a href="mailto:gagalab@qq.com" data-i18n="footer.email">gagalab@qq.com</a>
        </div>
      </div>
      <div class="footer-bottom">
        <span data-i18n="footer.univ">南开大学 · 药学院</span>
        <span data-i18n="footer.copyright">© 2026 GaGaLab</span>
      </div>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script>
    function renderNewsDetail() {
      const params = new URLSearchParams(window.location.search);
      const idx = parseInt(params.get("id") || "0", 10);
      const item = i18n.newsPage.items[idx];
      const el = document.querySelector("#news-detail");
      if (!item) {
        el.innerHTML = `<p>新闻不存在。<a href="news.html" style="color:var(--primary);">返回新闻列表</a></p>`;
        return;
      }
      document.title = `${t(item.title)}-GaGaLab`;
      el.innerHTML = `
        <div class="news-date" style="color:var(--text-dim);font-family:var(--font-mono);margin-bottom:12px;">${t(item.date)}</div>
        <h1 style="font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:24px;">${t(item.title)}</h1>
        ${item.image ? `<img src="${item.image}" alt="${t(item.title)}" style="width:100%;max-height:420px;object-fit:cover;border-radius:12px;margin-bottom:28px;" />` : ""}
        <div class="news-detail-body" style="font-size:1.05rem;line-height:1.9;color:var(--text);text-align:justify;text-justify:inter-ideograph;">${t(item.content)}</div>
      `;
    }
    renderNewsDetail();
    applyI18n();
    window.addEventListener("langchange", () => { renderNewsDetail(); applyI18n(); });
  </script>
</body>
</html>
