name: Auto-build inline data

on:
  push:
    branches: [main]
    paths:
      - "news/*.md"
      - "people/*.md"
      - "publications/*.md"
      - "research/*.md"
      - "build.js"

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build inline data.js
        run: node build.js
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js
          git diff --staged --quiet || git commit -m "auto: rebuild data.js" && git push
