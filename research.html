<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="researchPage.title">研究方向-GaGaLab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet" /><link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="brand">
        <img src="assets/logo.png" alt="GaGaLab" class="logo-img" /><span class="brand-text"><span data-i18n="brand.full">GaGaLab</span></span>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html" data-i18n="nav.home">首页</a>
        <a href="research.html" data-i18n="nav.research">研究方向</a>
        <a href="people.html" data-i18n="nav.people">团队成员</a>
        <a href="publications.html" data-i18n="nav.publications">论文成果</a>
        <a href="news.html" data-i18n="nav.news">新闻动态</a>
        <a href="join.html" data-i18n="nav.join">加入我们</a>
        <a href="contact.html" data-i18n="nav.contact">联系方式</a>
      </nav>
      <div class="nav-tools">
        <div class="lang-toggle">
          <button data-lang="zh" type="button">中</button>
          <button data-lang="en" type="button">EN</button>
        </div>
        <button class="nav-toggle" id="navToggle" type="button" aria-label="菜单">☰</button>
      </div>
    </div>
  </header>

  <section class="page-header has-bg" style="--header-bg: url('/assets/luoxuan.png')">
    <div class="container">
      <h1 data-i18n="researchPage.title">研究方向</h1>
      <p data-i18n="researchPage.subtitle">胚胎发育与干细胞多能性调控，我们形成了多个相互支撑的研究方向。</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="research-detail-grid" id="research-detail-grid"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-logos">
        <img src="assets/nankaidaxue.png" alt="南开大学" class="footer-logo" />
        <img src="assets/shengmingkexuexueyuan.png" alt="南开大学生命科学学院" class="footer-logo" />
      </div>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/data-loader.js"></script>
  <script src="js/main.js"></script>
  <script>
    let researchItems = null;

    async function loadResearchData() {
      try {
        const mdItems = await DataLoader.loadResearchIndex();
        if (mdItems && mdItems.length > 0) {
          researchItems = mdItems;
          return;
        }
      } catch (e) {}
      researchItems = i18n.researchPage.items.map((it, i) => ({
        file: `fallback-${i}`,
        title: it.title,
        desc: it.desc,
        tags: it.tags,
      }));
    }

    function getTags(item) {
      const raw = t(item.tags);
      if (Array.isArray(raw)) return raw;
      if (typeof raw === "string") return raw.split(",").map(s => s.trim()).filter(Boolean);
      return [];
    }

    function renderResearchDetail() {
      if (!researchItems) return;
      const html = researchItems.map((item) => {
        const tags = getTags(item);
        return `
        <a href="research-detail.html?dir=${encodeURIComponent(item.file)}" class="research-detail-card reveal" style="text-decoration:none;color:inherit;">
          <h3>${t(item.title)}</h3>
          <p>${t(item.desc) || ""}</p>
          ${tags.length ? `<div class="tags">${tags.map(tag => `<span>${tag}</span>`).join(" · ")}</div>` : ""}
        </a>
      `}).join("");
      const grid = document.querySelector("#research-detail-grid");
      if (grid) grid.innerHTML = html;
    }

    (async function init() {
      applyI18n();
      document.querySelector("#research-detail-grid").innerHTML =
        `<p style="color:var(--text-dim);text-align:center;">${currentLang === "zh" ? "加载中…" : "Loading…"}</p>`;
      await loadResearchData();
      renderResearchDetail();
      applyI18n();
      if (window.location.hash) {
        const target = document.querySelector(window.location.hash);
        if (target) {
          setTimeout(() => {
            target.scrollIntoView({ behavior: "smooth", block: "center" });
            target.classList.add("highlight");
            setTimeout(() => target.classList.remove("highlight"), 2500);
          }, 300);
        }
      }
    })();

    window.addEventListener("langchange", () => { renderResearchDetail(); applyI18n(); });
  </script>
</body>
</html>
