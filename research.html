    <div class="nav-inner">
      <a href="index.html" class="brand">
        <span class="logo-mark">L</span>
        <span class="brand-text"><span data-i18n="brand.full">GaGaLab</span><small data-i18n="brand.short">课题组</small></span>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html" data-i18n="nav.home">首页</a>
        <a href="research.html" data-i18n="nav.research">研究方向</a>
        <a href="people.html" data-i18n="nav.people">团队成员</a>

        <a href="news.html" data-i18n="nav.news">新闻动态</a>
        <a href="join.html" data-i18n="nav.join">加入我们</a>

      </nav>
      <div class="nav-tools">
        <div class="lang-toggle">

        </div>
        <button class="nav-toggle" id="navToggle" type="button" aria-label="菜单">☰</button>
      </div>
    </div>
  </header>

  <section class="page-header">
    <div class="container">
      <span class="eyebrow" data-i18n="researchPage.title">研究方向</span>
      <h1 data-i18n="researchPage.title">研究方向</h1>
      <p data-i18n="researchPage.subtitle">课题组围绕生物信息学方法学与关键生物学问题，形成以下研究方向。</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="research-detail-grid" id="research-detail-grid"></div>
    </div>
  </section>

  <section class="section" style="background: var(--bg-alt);">
    <div class="container">
      <div class="section-title reveal">
        <h2 data-i18n="researchPage.detailTitle">代表性工具与产出</h2>
      </div>
      <div class="research-detail-grid" id="research-tools-grid"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-col footer-brand">
          <a href="index.html" class="brand"><span class="logo-mark">L</span><span class="brand-text"><span data-i18n="footer.aboutTitle">GaGaLab</span><small data-i18n="brand.short">课题组</small></span></a>
          <p data-i18n="footer.about">隶属学校名称，致力于生物信息学方法学与生物学问题研究。</p>
        </div>
        <div class="footer-col">
          <h5 data-i18n="footer.linksTitle">快速链接</h5>
          <a href="research.html" data-i18n="nav.research">研究方向</a>
          <a href="people.html" data-i18n="nav.people">团队成员</a>
          <a href="publications.html" data-i18n="nav.publications">论文成果</a>
          <a href="join.html" data-i18n="nav.join">加入我们</a>
        </div>
        <div class="footer-col">
          <h5 data-i18n="nav.news">新闻动态</h5>
          <a href="news.html" data-i18n="nav.news">实验室动态</a>
          <a href="publications.html" data-i18n="nav.publications">最新论文</a>
          <a href="join.html" data-i18n="nav.join">招生信息</a>
        </div>
        <div class="footer-col">
          <h5 data-i18n="footer.contactTitle">联系方式</h5>
          <p data-i18n="footer.addr">学校名称 · 学院名称 · 实验室房间号</p>
          <a href="mailto:lab@example.edu" data-i18n="footer.email">lab@example.edu</a>
        </div>
      </div>
      <div class="footer-bottom">
        <span data-i18n="footer.copyright">© 2026 GaGaLab. 保留所有权利。</span>
        <span data-i18n="footer.built">由课题组构建</span>
      </div>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script>
    // 研究方向详情页渲染
    function renderResearchDetail() {
      const html = i18n.researchPage.items.map((item) => `
        <article class="research-detail-card reveal">
          <div class="icon">${item.icon}</div>
          <h3>${t(item.title)}</h3>
          <p>${t(item.desc)}</p>
          <div class="tools">🔧 ${t(item.tools)}</div>
          <div class="tags">${item.tags.map(tag => `<span>${tag}</span>`).join("")}</div>
        </article>
      `).join("");
      const grid1 = document.querySelector("#research-detail-grid");
      const grid2 = document.querySelector("#research-tools-grid");
      if (grid1) grid1.innerHTML = html;
      if (grid2) grid2.innerHTML = html;
    }
    renderResearchDetail();
    applyI18n();
    document.querySelectorAll(".reveal").forEach(el => {
      const o = new IntersectionObserver((e) => {
        e.forEach(x => { if (x.isIntersecting) { x.target.classList.add("in-view"); o.unobserve(x.target); } });
      }, { threshold: 0.1 });
      o.observe(el);
    });
  </script>
</body>
</html>
