<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GaGaLab</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="brand">
        <img src="assets/logo.png" alt="GaGaLab" class="logo-img" /><span class="brand-text"><span data-i18n="brand.full">GaGaLab</span></span>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html" data-i18n="nav.home">首页</a>
        <a href="research.html" data-i18n="nav.research">研究方向</a>
        <a href="people.html" data-i18n="nav.people">团队成员</a>
        <a href="publications.html" data-i18n="nav.publications">论文成果</a>
        <a href="news.html" data-i18n="nav.news">新闻动态</a>
        <a href="join.html" data-i18n="nav.join">加入我们</a>
        <a href="contact.html" data-i18n="nav.contact">联系方式</a>
      </nav>
      <div class="nav-tools">
        <div class="lang-toggle">
          <button data-lang="zh" type="button">中</button>
          <button data-lang="en" type="button">EN</button>
        </div>
        <button class="nav-toggle" id="navToggle" type="button" aria-label="菜单">☰</button>
      </div>
    </div>
  </header>

  <section class="page-header">
    <div class="container">
      <div id="dir-content"></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div id="dir-findings"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-logos">
        <img src="assets/nankaidaxue.png" alt="南开大学" class="footer-logo" />
        <img src="assets/shengmingkexuexueyuan.png" alt="南开大学生命科学学院" class="footer-logo" />
      </div>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script>
    function renderDirDetail() {
      const params = new URLSearchParams(window.location.search);
      const idx = parseInt(params.get("dir") || "0", 10);
      const item = i18n.researchPage.items[idx];
      const content = document.querySelector("#dir-content");
      const findings = document.querySelector("#dir-findings");
      if (!item) {
        content.innerHTML = `<p>方向不存在。<a href="research.html" style="color:var(--primary);">返回研究方向</a></p>`;
        findings.innerHTML = "";
        return;
      }
      document.title = `${t(item.title)}-GaGaLab`;
      content.innerHTML = `
        <div class="icon" style="font-size:3rem;margin-bottom:16px;">${item.icon}</div>
        <h1>${t(item.title)}</h1>
        <p style="font-size:1.1rem;color:var(--text-dim);max-width:760px;line-height:1.8;">${t(item.desc)}</p>
        <div class="tags" style="margin-top:20px;">${t(item.tags).map(tag => `<span>${tag}</span>`).join("")}</div>
      `;
      const list = (item.findings || []).map(f => `
        <a href="${f.link}" class="finding-item" target="_blank" rel="noopener">
          <span class="finding-year">${f.year}</span>
          <span class="finding-title">${t(f.title)}</span>
          <span class="finding-venue">${t(f.venue)} · ${t(f.authors)}</span>
        </a>
      `).join("");
      findings.innerHTML = `
        <div class="findings-section">
          <div class="findings-label" data-i18n="researchPage.findingsLabel">代表论文</div>
          ${list}
        </div>
      `;
    }
    renderDirDetail();
    applyI18n();
    window.addEventListener("langchange", () => { renderDirDetail(); applyI18n(); });
  </script>
</body>
</html>
