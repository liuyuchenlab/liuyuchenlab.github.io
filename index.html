<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GaGaLab</title>
  <meta name="description" content="GaGaLab - 专注于发育生物学研究的团队" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet" />
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ============ 顶部导航 ============ -->
  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="brand">
        <img src="assets/logo.png" alt="GaGaLab" class="logo-img" /><span class="brand-text"><span data-i18n="brand.full">GaGaLab</span></span>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html" data-i18n="nav.home">首页</a>
        <a href="research.html" data-i18n="nav.research">研究方向</a>
        <a href="people.html" data-i18n="nav.people">团队成员</a>
        <a href="publications.html" data-i18n="nav.publications">论文成果</a>
        <a href="news.html" data-i18n="nav.news">新闻动态</a>
        <a href="join.html" data-i18n="nav.join">加入我们</a>
        <a href="contact.html" data-i18n="nav.contact">联系方式</a>
      </nav>
      <div class="nav-tools">
        <div class="lang-toggle">
          <button data-lang="zh" type="button">中</button>
          <button data-lang="en" type="button">EN</button>
        </div>
        <button class="nav-toggle" id="navToggle" type="button" aria-label="菜单">☰</button>
      </div>
    </div>
  </header>

  <!-- ============ 英雄区 ============ -->
  <section class="hero">
    <div class="hero-bg">
      <img src="assets/star.jpg" alt="Hero background" />
    </div>
    <div class="container">
      <div class="hero-content">
        <h1>
          <span data-i18n="hero.title1">感受生命之美</span>
        </h1>
        <p class="lead" data-i18n="hero.lead">
          我们怀着对生命的好奇与热爱，探索发育过程中的奇妙奥秘。从受精到衰老，每一个发现都让我们更接近生命的真相。
        </p>
      </div>
    </div>
  </section>

  <!-- ============ 新闻 + 招生 两栏 ============ -->
  <section class="section home-two-col">
    <div class="container">
      <div class="two-col-grid">
        <!-- 左：课题组 logo -->
        <div class="col-logo">
          <img src="assets/logo.png" alt="GaGaLab" class="col-logo-img" />
          <span class="col-logo-text">GaGaLab</span>
        </div>

        <!-- 中：新闻动态 -->
        <div class="col-news reveal">
          <div class="col-header">
            <h2 data-i18n="news.title">实验室动态</h2>
          </div>
          <div class="news-list" id="news-list">
            <!-- 由 main.js 动态渲染 -->
          </div>
        </div>

        <!-- 右：加入我们 -->
        <div class="col-join reveal">
          <div class="col-header">
            <h2 data-i18n="cta.title">加入我们</h2>
          </div>
          <div class="join-row join-lead" data-i18n="cta.lead">我们需要所有层级的申请者</div>
          <div class="join-row"><span data-i18n="cta.body">（本科生、硕士生、博士生、博士后、科研助理与实验员）欢迎邮件联系 </span><a href="mailto:gagalab@qq.com">gagalab@qq.com</a></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 页脚 ============ -->
  <footer class="footer">
    <div class="container">
      <div class="footer-logos">
        <img src="assets/nankaidaxue.png" alt="南开大学" class="footer-logo" />
        <img src="assets/shengmingkexuexueyuan.png" alt="南开大学生命科学学院" class="footer-logo" />
      </div>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
